<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Lega - Tempat Cerita Aman & Anonim</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f7f5f0] min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">
<div class="bg-white rounded-[2rem] shadow-xl p-8 border border-stone-100">
<div class="text-center mb-8">
<div class="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">🌿</div>
<h1 class="text-3xl font-bold tracking-tight">Ruang Lega</h1>
<p class="text-stone-500 mt-2 text-sm">Tempat cerita yang aman & anonim</p>
</div>
<div id="authBox">
<input id="email" type="email" placeholder="Email" class="w-full px-5 py-4 rounded-2xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-green-200 mb-3">
<input id="password" type="password" placeholder="Password (min 6)" class="w-full px-5 py-4 rounded-2xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-green-200 mb-4">
<button id="btnAuth" class="w-full bg-stone-900 text-white py-4 rounded-2xl font-semibold hover:bg-black transition">Masuk / Daftar</button>
<p id="msg" class="text-center text-xs text-red-500 mt-3"></p>
</div>
<div id="appBox" class="hidden">
<p id="userInfo" class="text-xs text-stone-500 mb-3"></p>
<textarea id="curhatInput" placeholder="Tulis curhatanmu di sini... lega rasanya kalau diceritakan 🌿" class="w-full h-32 p-4 rounded-2xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-green-200 resize-none"></textarea>
<div class="flex gap-2 mt-3">
<button id="btnKirim" class="flex-1 bg-green-600 text-white py-3 rounded-2xl font-semibold">Kirim Curhat Privat</button>
<button id="btnLogout" class="px-5 bg-stone-100 rounded-2xl">Keluar</button>
</div>
<div id="list" class="mt-6 space-y-3"></div>
</div>
<div class="text-center mt-6 text-[10px] text-stone-400 tracking-widest">Firebase: ruang-lega • curhat privat + cerita_publik anonim</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC-EXAMPLE-GANTI-DENGAN-APIKEY-KAMU",
  authDomain: "ruang-lega.firebaseapp.com",
  projectId: "ruang-lega",
  storageBucket: "ruang-lega.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const btnAuth = document.getElementById('btnAuth');
const msgEl = document.getElementById('msg');
const authBox = document.getElementById('authBox');
const appBox = document.getElementById('appBox');
const userInfo = document.getElementById('userInfo');
const curhatInput = document.getElementById('curhatInput');
const btnKirim = document.getElementById('btnKirim');
const btnLogout = document.getElementById('btnLogout');
const listEl = document.getElementById('list');
btnAuth.onclick = async () => {
  const e = emailEl.value; const p = passEl.value;
  if(!e||!p){msgEl.textContent="Isi email & password";return;}
  try{await signInWithEmailAndPassword(auth,e,p);}catch{try{await createUserWithEmailAndPassword(auth,e,p);}catch(err){msgEl.textContent=err.message;}}
};
onAuthStateChanged(auth,user=>{
  if(user){authBox.classList.add('hidden');appBox.classList.remove('hidden');userInfo.textContent="Masuk sebagai: "+user.email;
  const q = query(collection(db,"curhat"), where("uid","==",user.uid));
  onSnapshot(q,snap=>{listEl.innerHTML="";snap.forEach(d=>{const div=document.createElement('div');div.className="p-4 bg-stone-50 rounded-2xl text-sm";div.textContent=d.data().teks;listEl.prepend(div);});});
  }else{authBox.classList.remove('hidden');appBox.classList.add('hidden');}
});
btnKirim.onclick = async () => {
  const teks = curhatInput.value.trim(); if(!teks)return;
  await addDoc(collection(db,"curhat"),{uid:auth.currentUser.uid, teks, created:serverTimestamp()});
  curhatInput.value=""; alert("Lega! Curhatan tersimpan 🌿");
};
btnLogout.onclick = ()=>signOut(auth);
</script>
</body>
</html>
