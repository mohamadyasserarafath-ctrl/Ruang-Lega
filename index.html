<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Lega V7.3 OFFLINE FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Plus Jakarta Sans',sans-serif}::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#0a0f0e] text-white">
<div class="max-w-md mx-auto min-h-screen bg-[#121916] flex flex-col">
<header class="p-3 flex justify-between items-center border-b border-[#1f332b] sticky top-0 bg-[#121916] z-20">
<div class="flex gap-2 items-center"><div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-black font-bold">V3</div><div><p class="text-sm font-bold">Ruang Lega V7.3 FIX</p><p class="text-[10px] text-emerald-400">Offline • 100% Jadi ✅</p></div></div>
<button id="resetBtn" class="text-[10px] px-2 py-1 rounded-full bg-[#1a2520] border border-[#1f332b]">Reset</button>
</header>
<div class="p-3 bg-[#0f1714] border-b border-[#1f332b]">
<div class="bg-[#1a2520] border border-emerald-500/30 rounded-2xl p-4"><p class="text-[10px] text-emerald-400 font-bold">💡 PROMPT HARI INI</p><p id="promptText" class="text-[13px] mt-1 font-semibold"></p></div>
<div class="flex gap-2 mt-3"><input id="sr" placeholder="🔍 Cari..." class="flex-1 p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-xs"><select id="filterSel" class="p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-[11px]"><option value="Semua">Semua</option><option value="ButuhPeluk">Butuh Peluk</option><option value="Lega">Lega</option></select></div>
</div>
<div class="flex-1 overflow-y-auto p-3 pb-28">
<div id="vb"><div class="bg-[#1a2520] border border-[#1f332b] rounded-2xl p-3 mb-3 flex justify-between"><b class="text-xs">📊 <span id="totalPost">0</span> cerita di HP</b><span class="text-[10px] bg-emerald-500/20 px-2 py-1 rounded-full">V7.3</span></div><div id="pl" class="space-y-3"></div></div>
<div id="vt" class="hidden"><div class="bg-[#1a2520] border border-[#1f332b] rounded-2xl p-4"><b class="text-sm">✍️ Tulis Curhat</b><input id="jd" placeholder="Judul" class="w-full mt-3 p-3 rounded-xl bg-[#0d1411] border border-[#1f332b] text-sm font-bold"><textarea id="ct" placeholder="Tulis..." class="w-full mt-2 bg-[#0d1411] p-3 rounded-xl border border-[#1f332b] h-36 text-sm"></textarea><div class="grid grid-cols-2 gap-2 mt-2"><select id="mo" class="p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-xs"><option>😔 Sedih</option><option>😰 Cemas</option><option>😊 Lega</option><option>🥰 Bersyukur</option><option>😮‍💨 Lelah</option></select><select id="tg" class="p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-xs"><option>Burnout</option><option>Healing</option><option>Overthinking</option></select></div><input id="pn" placeholder="Nama Anonim" class="w-full mt-2 p-3 rounded-xl bg-[#0d1411] border border-[#1f332b] text-sm"><button id="bK" class="w-full bg-emerald-500 text-black p-3 rounded-xl mt-3 font-bold">✨ Kirim</button></div></div>
</div>
<div class="fixed bottom-0 w-full max-w-md bg-[#121916]/95 border-t border-[#1f332b] flex z-20"><button data-v="b" class="nv flex-1 p-3 text-[10px] bg-emerald-500 text-black font-bold">🏠 Beranda</button><button data-v="t" class="nv flex-1 p-3 text-[10px]">✍️ Tulis</button><button id="shareApp" class="flex-1 p-3 text-[10px]">🔗 Share</button></div>
<div id="to" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 bg-emerald-500 text-black px-4 py-2 rounded-full text-xs font-bold z-50"></div>
</div>
<script>
const prompts=["Apa hal kecil yang bikin kamu bertahan hari ini?","Tulis 3 hal yang kamu syukuri.","Kalau cemas punya warna, apa warnanya?"];
const $=id=>document.getElementById(id);
let data=JSON.parse(localStorage.getItem('ruanglega_v73')||'[{"title":"YEEY V7.3 BERHASIL! 🎉","text":"Kalau kamu baca ini, berarti upload kamu BERHASIL! V7 udah berubah jadi V7.3. Sekarang coba tulis curhat di menu Tulis.","mood":"😊 Lega","tag":"Healing","author":"System","time":Date.now(),"hugs":5}]');
$("promptText").textContent=prompts[Math.floor(Math.random()*prompts.length)];
function toast(m){let t=$("to");t.textContent=m;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2500)}
function esc(s){return (s||'').replace(/</g,'&lt;')}
function render(){let q=$("sr").value.toLowerCase();let f=$("filterSel").value;let list=[...data].sort((a,b)=>b.time-a.time);if(f=="ButuhPeluk")list=list.filter(d=>d.mood.includes("Sedih")||d.mood.includes("Cemas"));if(f=="Lega")list=list.filter(d=>d.mood.includes("Lega")||d.mood.includes("Syukur"));if(q)list=list.filter(d=>(d.title+" "+d.text).toLowerCase().includes(q));$("totalPost").textContent=data.length;$("pl").innerHTML=list.map((d,i)=>`<div class="bg-[#1a2520] border border-[#1f332b] rounded-2xl p-4"><div class="flex justify-between"><span class="text-xs font-bold">${esc(d.author)}</span><span class="text-[10px] bg-[#0d1411] px-2 py-1 rounded-full">#${esc(d.tag)}</span></div><b class="text-[14px] block mt-3">${esc(d.title)}</b><p class="text-[13px] mt-2 text-[#c5d5cc] whitespace-pre-wrap">${esc(d.text)}</p><div class="flex gap-2 mt-3"><span class="text-[10px] bg-[#0d1411] border border-[#1f332b] px-2 py-1 rounded-full">${esc(d.mood)}</span></div><div class="flex gap-2 mt-4 pt-3 border-t border-[#1f332b]/50 text-xs"><button onclick="hug(${data.indexOf(d)})">🤗 ${d.hugs||0}</button><button onclick="del(${data.indexOf(d)})" class="text-red-400 ml-auto">🗑️</button></div></div>`).join("")}
window.hug=i=>{data[i].hugs=(data[i].hugs||0)+1;localStorage.setItem('ruanglega_v73',JSON.stringify(data));render();toast("🤗")};
window.del=i=>{if(confirm("Hapus?")){data.splice(i,1);localStorage.setItem('ruanglega_v73',JSON.stringify(data));render()}};
$("bK").onclick=()=>{let t=$("jd").value.trim(),c=$("ct").value.trim();if(!t||!c)return toast("Isi dulu");data.unshift({title:t,text:c,mood:$("mo").value,tag:$("tg").value,author:$("pn").value||"Anonim",time:Date.now(),hugs:0});localStorage.setItem('ruanglega_v73',JSON.stringify(data));$("jd").value="";$("ct").value="";toast("Terkirim ✨");document.querySelector('[data-v="b"]').click();render()};
$("sr").oninput=render;$("filterSel").onchange=render;
document.querySelectorAll(".nv").forEach(b=>b.onclick=()=>{let v=b.dataset.v;document.querySelectorAll(".nv").forEach(x=>x.className="nv flex-1 p-3 text-[10px]");b.className="nv flex-1 p-3 text-[10px] bg-emerald-500 text-black font-bold";$("vb").classList.toggle("hidden",v!="b");$("vt").classList.toggle("hidden",v!="t");});
$("resetBtn").onclick=()=>{if(confirm("Reset semua?")){localStorage.removeItem('ruanglega_v73');location.reload()}};
$("shareApp").onclick=()=>{navigator.clipboard.writeText(location.href);toast("Link disalin")};
render();
</script>
</body>
</html>
