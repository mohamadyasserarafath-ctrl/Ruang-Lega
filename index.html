<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Lega V6.1 - Anti Mentok</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.fj{font-family:sans-serif}
.fs{font-family:serif}
.fh{font-family:cursive}
</style>
</head>
<body class="bg-[#0a0f0e] text-white">
<div class="max-w-md mx-auto min-h-screen bg-[#121916] flex flex-col relative">
<header class="p-3 flex justify-between items-center border-b border-[#1f332b] sticky top-0 bg-[#121916] z-20">
<div class="flex gap-2 items-center">
<div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-black font-bold">🌿</div>
<div>
<p class="text-sm font-bold">Ruang Lega V6.1</p>
<p class="text-[10px] text-emerald-400">Mode Demo - Langsung Jalan</p>
</div>
</div>
<button id="sosBtn" class="w-8 h-8 rounded-full bg-red-500/20 border border-red-500 text-red-400">🆘</button>
</header>

<div class="p-3 bg-[#0f1714] border-b border-[#1f332b]">
<div class="bg-[#1a2520] border border-emerald-500/30 rounded-xl p-3">
<p class="text-[10px] text-emerald-400 font-bold">💡 PROMPT HARI INI</p>
<p id="promptText" class="text-xs mt-1">Apa satu hal kecil yang bikin kamu bertahan hari ini?</p>
<button onclick="usePrompt()" class="text-[10px] bg-emerald-500 text-black px-2 py-1 rounded-full mt-2">Pakai prompt ✍️</button>
</div>
<input id="sr" placeholder="🔍 Cari cerita..." class="w-full mt-2 p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-xs">
<div class="flex gap-1.5 mt-2 overflow-x-auto">
<button data-t="Semua" class="fc active px-3 py-1.5 rounded-full bg-emerald-500 text-black text-[10px] font-bold">Semua</button>
<button data-t="Burnout" class="fc px-3 py-1.5 rounded-full bg-[#1a2520] text-[10px]">#Burnout</button>
<button data-t="Cemas" class="fc px-3 py-1.5 rounded-full bg-[#1a2520] text-[10px]">#Cemas</button>
<button data-t="Saved" class="fc px-3 py-1.5 rounded-full bg-[#1a2520] text-[10px]">🔖 Disimpan</button>
</div>
</div>

<div class="flex-1 overflow-y-auto p-3 pb-28">
<div id="vb">
<div class="bg-[#1a2520] border border-[#1f332b] rounded-xl p-3 mb-3">
<div class="flex justify-between"><b class="text-xs">📊 Mood</b><span id="totalPost" class="text-[10px] bg-[#0d1411] px-2 py-1 rounded-full">0 cerita</span></div>
<div id="moodBar" class="flex gap-1 mt-2 h-8 items-end"></div>
</div>
<div id="pl" class="space-y-3"></div>
</div>

<div id="vt" class="hidden">
<div class="bg-[#1a2520] border border-[#1f332b] rounded-xl p-4">
<b class="text-sm">✍️ Tulis Curhat</b>
<input id="jd" placeholder="Judul" class="w-full mt-3 p-3 rounded-xl bg-[#0d1411] border border-[#1f332b] text-sm font-bold">
<textarea id="ct" placeholder="Tulis seleganya..." class="w-full mt-2 bg-[#0d1411] p-3 rounded-xl border border-[#1f332b] h-32 text-sm"></textarea>
<div class="grid grid-cols-2 gap-2 mt-2">
<select id="mo" class="p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-xs">
<option>😔 Sedih</option><option>😰 Cemas</option><option>😊 Lega</option><option>🥰 Bersyukur</option>
</select>
<select id="tg" class="p-2.5 rounded-full bg-[#0d1411] border border-[#1f332b] text-xs">
<option>Burnout</option><option>CemasKuliah</option><option>AnakPertama</option><option>Healing</option>
</select>
</div>
<input id="pn" placeholder="Nama Anonim" value="Anonim" class="w-full mt-2 p-3 rounded-xl bg-[#0d1411] border border-[#1f332b] text-sm">
<button id="bK" class="w-full bg-emerald-500 text-black p-3 rounded-xl mt-3 font-bold">✨ Kirim Cerita</button>
</div>
</div>
</div>

<div class="fixed bottom-0 w-full max-w-md bg-[#121916] border-t border-[#1f332b] flex z-20">
<button data-v="b" class="nv flex-1 p-3 text-[10px] bg-emerald-500 text-black font-bold">🏠<br>Beranda</button>
<button data-v="t" class="nv flex-1 p-3 text-[10px]">✍️<br>Tulis</button>
<button data-v="c" class="nv flex-1 p-3 text-[10px]">🔖<br>Simpan</button>
</div>

<div id="to" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 bg-emerald-500 text-black px-4 py-2 rounded-full text-xs font-bold z-50"></div>
</div>

<!-- SOS MODAL -->
<div id="sosModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4">
<div class="bg-[#121916] w-full max-w-sm rounded-2xl border border-red-500/30 p-5 text-center">
<div class="w-14 h-14 mx-auto bg-red-500/20 rounded-full flex items-center justify-center text-2xl">🆘</div>
<h2 class="font-bold mt-3">Kamu Gak Sendiri</h2>
<p class="text-xs text-[#7a9a8a] mt-1">Hubungi bantuan profesional:</p>
<a href="tel:119" class="block w-full mt-4 bg-red-500 text-white p-3 rounded-xl font-bold text-sm">📞 Call 119</a>
<button id="sosClose" class="w-full mt-3 bg-[#1a2520] p-3 rounded-xl text-xs">Tutup 🤗</button>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,query,onSnapshot,serverTimestamp,doc,updateDoc,increment,arrayUnion,arrayRemove,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={
apiKey:"AIzaSyDCMGFYKAFXcAWdVAgd35P7BCH8cXuxgmU",
authDomain:"ruang-lega.firebaseapp.com",
projectId:"ruang-lega",
storageBucket:"ruang-lega.firebasestorage.app",
messagingSenderId:"854510951413",
appId:"1:854510951413:web:0582a9f3852ed4775bdebc"
};
const app=initializeApp(cfg);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
let cache=[],savedIds=JSON.parse(localStorage.getItem('saved')||'[]');
const prompts=["Apa satu hal kecil yang bikin kamu bertahan hari ini?","Kalau cemasmu punya warna, apa warnanya?","Apa yang ingin kamu bilang ke diri kamu 5 tahun lalu?","Tulis 3 hal yang kamu syukuri hari ini"];
$("promptText").textContent=prompts[Math.floor(Math.random()*prompts.length)];
window.usePrompt=()=>{$("ct").value=$("promptText").textContent+"\n\n"; document.querySelector('[data-v="t"]').click()};

function toast(m){let t=$("to");t.textContent=m;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2000)}
function esc(t){return (t||'').replace(/</g,'&lt;')}
function fmt(ts){return ts?.toDate?ts.toDate().toLocaleDateString("id-ID"):"Baru"}

$("sosBtn").onclick=()=>$("sosModal").classList.remove("hidden");
$("sosClose").onclick=()=>$("sosModal").classList.add("hidden");

$("bK").onclick=async()=>{
let t=$("jd").value.trim(),c=$("ct").value.trim();
if(!t||!c){toast("Isi judul & cerita");return}
$("bK").textContent="Mengirim...";
try{
await addDoc(collection(db,"cerita_publik"),{
title:t,text:c,mood:$("mo").value,tag:$("tg").value,author:$("pn").value||"Anonim",avatar:"🌿",
hugs:[],hugsCount:0,commentsCount:0,createdAt:serverTimestamp()
});
$("jd").value="";$("ct").value="";toast("Terkirim ✨");document.querySelector('[data-v="b"]').click()
}catch(e){toast(e.message)}
$("bK").textContent="✨ Kirim Cerita"
};

function rp(){
let list=cache;
let tag=document.querySelector(".fc.active")?.dataset.t||"Semua";
if(tag=="Saved")list=list.filter(d=>savedIds.includes(d.id));
else if(tag!="Semua")list=list.filter(d=>d.tag==tag||d.mood?.includes(tag));
let s=$("sr").value.toLowerCase();
if(s)list=list.filter(d=>(d.title+" "+d.text).toLowerCase().includes(s));
$("totalPost").textContent=cache.length+" cerita";
if(!list.length){$("pl").innerHTML='<p class="text-center text-xs text-[#7a9a8a] py-10">Belum ada cerita</p>';return}
$("pl").innerHTML=list.map(d=>{
let saved=savedIds.includes(d.id);
return `<div class="bg-[#1a2520] border border-[#1f332b] rounded-2xl p-4">
<div class="flex justify-between"><b class="text-xs">${esc(d.author||"Anonim")}</b><span class="text-[10px] text-[#7a9a8a]">#${d.tag} • ${fmt(d.createdAt)}</span></div>
<b class="text-[14px] block mt-2">${esc(d.title)}</b>
<p class="text-[13px] mt-2 text-[#c5d5cc] whitespace-pre-wrap">${esc(d.text)}</p>
<div class="flex justify-between mt-4 pt-3 border-t border-[#1f332b]/50 text-xs">
<button onclick="hug('${d.id}')">🤗 ${d.hugsCount||0} Peluk</button>
<button onclick="savePost('${d.id}')" class="${saved?'text-emerald-400':''}">${saved?'🔖 Tersimpan':'🔖 Simpan'}</button>
<button onclick="share()">🔗 Share</button>
</div></div>`
}).join("")
}

window.hug=async id=>{
let r=doc(db,"cerita_publik",id);
let snap=await getDoc(r);
let uid=localStorage.getItem('myUid')||'anon-'+Math.random().toString(36).slice(2);
localStorage.setItem('myUid',uid);
let hg=snap.data().hugs?.includes(uid);
if(hg)await updateDoc(r,{hugs:arrayRemove(uid),hugsCount:increment(-1)});
else await updateDoc(r,{hugs:arrayUnion(uid),hugsCount:increment(1)});
};
window.savePost=id=>{
if(savedIds.includes(id))savedIds=savedIds.filter(x=>x!=id);else savedIds.push(id);
localStorage.setItem('saved',JSON.stringify(savedIds));rp();toast(savedIds.includes(id)?"Disimpan 🔖":"Dihapus")
};
window.share=()=>{navigator.clipboard.writeText(location.href);toast("Link disalin 🔗")};

document.querySelectorAll(".fc").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".fc").forEach(x=>x.className="fc px-3 py-1.5 rounded-full bg-[#1a2520] text-[10px]");
b.className="fc active px-3 py-1.5 rounded-full bg-emerald-500 text-black text-[10px] font-bold";
rp()
}
});
$("sr").oninput=rp;
document.querySelectorAll(".nv").forEach(btn=>{
btn.onclick=()=>{
let v=btn.dataset.v;
document.querySelectorAll(".nv").forEach(x=>x.className="nv flex-1 p-3 text-[10px]");
btn.className="nv flex-1 p-3 text-[10px] bg-emerald-500 text-black font-bold";
$("vb").classList.toggle("hidden",v!="b");
$("vt").classList.toggle("hidden",v!="t");
if(v=="c"){document.querySelector('[data-t="Saved"]').click(); $("vb").classList.remove("hidden"); $("vt").classList.add("hidden")}
}
});

onSnapshot(query(collection(db,"cerita_publik")),s=>{
cache=[];s.forEach(d=>cache.push({id:d.id,...d.data()}));
cache.sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));
let moods={Sedih:0,Cemas:0,Lega:0,Bersyukur:0};cache.forEach(d=>{if(d.mood?.includes("Sedih"))moods.Sedih++;else if(d.mood?.includes("Cemas"))moods.Cemas++;else if(d.mood?.includes("Lega"))moods.Lega++;else moods.Bersyukur++});
let max=Math.max(...Object.values(moods),1);
$("moodBar").innerHTML=Object.entries(moods).map(([k,v])=>`<div class="flex-1 bg-emerald-500/60 rounded-t" style="height:${(v/max*100)||5}%"></div>`).join("");
rp();
});
</script>
</body>
</html>
