<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Lega - Tempat cerita yang aman & anonim</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#fdf9f3;min-height:100vh;display:flex;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:420px;border-radius:32px;padding:32px 24px;box-shadow:0 10px 40px rgba(0,0,0,.06);height:fit-content;margin-top:20px}
.logo{width:64px;height:64px;background:#e8f5e9;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px}
h1{text-align:center;font-size:28px;font-weight:800}
.sub{text-align:center;color:#888;font-size:14px;margin:6px 0 24px}
input,textarea{width:100%;padding:16px 18px;border-radius:999px;border:1.5px solid #e5e5e5;font-size:16px;outline:none}
textarea{border-radius:20px;min-height:90px;resize:none}
.btn{width:100%;padding:16px;background:#111;color:white;border:none;border-radius:999px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.error{color:#e53935;font-size:13px;text-align:center;margin-top:12px;min-height:18px}
.success{color:#2e7d32;font-size:13px;text-align:center;margin-top:12px}
.tabs{display:flex;background:#f5f5f5;border-radius:999px;padding:4px;margin:20px 0}
.tab{flex:1;padding:10px;text-align:center;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.tab.active{background:#111;color:white}
.section{display:none}
.section.active{display:block}
.story{background:#fafafa;border-radius:18px;padding:14px 16px;margin-top:12px;font-size:14px;line-height:1.5}
.story small{color:#999;display:block;margin-top:6px;font-size:11px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<div class="logo">🌿</div>
<h1>Ruang Lega</h1>
<div class="sub">Tempat cerita yang aman & anonim</div>
<div id="authBox">
<input id="email" type="email" placeholder="Email kamu" style="margin-bottom:12px">
<input id="pass" type="password" placeholder="Password (min 6 karakter)">
<button id="authBtn" class="btn">Masuk / Daftar</button>
<div id="msg" class="error"></div>
</div>
<div id="appBox" class="hidden">
<div style="text-align:center;font-size:13px;margin-bottom:12px">Login: <b id="userEmail"></b> <a href="#" id="logout" style="color:#e53935;margin-left:8px">Keluar</a></div>
<div class="tabs">
<div class="tab active" data-tab="privat">Curhat Privat</div>
<div class="tab" data-tab="publik">Cerita Publik</div>
</div>
<div id="privat" class="section active">
<textarea id="privatText" placeholder="Tulis curhat privat mu disini... hanya kamu yang bisa lihat"></textarea>
<button id="sendPrivat" class="btn">Simpan Curhat Privat</button>
<div id="privatList"></div>
</div>
<div id="publik" class="section">
<textarea id="publikText" placeholder="Tulis cerita anonim mu... akan tampil ke semua orang tanpa nama"></textarea>
<button id="sendPublik" class="btn">Posting Anonim</button>
<div id="publikList"></div>
</div>
<div id="appMsg" class="success"></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyDCMGFYKAFXcAWdVAgd35P7BCH8cXuxgmU",
authDomain: "ruang-lega.firebaseapp.com",
projectId: "ruang-lega",
storageBucket: "ruang-lega.firebasestorage.app",
messagingSenderId: "854510951413",
appId: "1:854510951413:web:0582a9f3852ed4775bdebc",
measurementId: "G-R7YH3WVED7"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const emailEl = document.getElementById('email');
const passEl = document.getElementById('pass');
const authBtn = document.getElementById('authBtn');
const msgEl = document.getElementById('msg');
const authBox = document.getElementById('authBox');
const appBox = document.getElementById('appBox');
const userEmailEl = document.getElementById('userEmail');
authBtn.onclick = async () => {
const email = emailEl.value.trim();
const pass = passEl.value;
if(!email || pass.length < 6){ msgEl.textContent = "Email & password min 6 karakter ya!"; return; }
msgEl.textContent = "Loading...";
authBtn.disabled = true;
try{ await signInWithEmailAndPassword(auth, email, pass);
}catch(e){
if(e.code === 'auth/invalid-credential' || e.code === 'auth/user-not-found'){
try{ await createUserWithEmailAndPassword(auth, email, pass);
}catch(e2){ msgEl.textContent = e2.message; authBtn.disabled=false; return; }
}else{ msgEl.textContent = e.message; authBtn.disabled=false; return; }
}
authBtn.disabled=false;
};
onAuthStateChanged(auth, user => {
if(user){
authBox.classList.add('hidden');
appBox.classList.remove('hidden');
userEmailEl.textContent = user.email;
loadPrivat(user.uid);
loadPublik();
}else{
authBox.classList.remove('hidden');
appBox.classList.add('hidden');
msgEl.textContent = "";
}
});
document.getElementById('logout').onclick = (e)=>{ e.preventDefault(); signOut(auth); };
document.querySelectorAll('.tab').forEach(t=>{
t.onclick = ()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(t.dataset.tab).classList.add('active');
}
});
document.getElementById('sendPrivat').onclick = async ()=>{
const txt = document.getElementById('privatText').value.trim();
if(!txt) return;
const user = auth.currentUser;
await addDoc(collection(db, "curhat_privat"), { uid: user.uid, text: txt, createdAt: serverTimestamp() });
document.getElementById('privatText').value = "";
document.getElementById('appMsg').textContent = "Curhat privat tersimpan ❤️";
setTimeout(()=>document.getElementById('appMsg').textContent="",2000);
};
document.getElementById('sendPublik').onclick = async ()=>{
const txt = document.getElementById('publikText').value.trim();
if(!txt) return;
await addDoc(collection(db, "cerita_publik"), { text: txt, createdAt: serverTimestamp() });
document.getElementById('publikText').value = "";
document.getElementById('appMsg').textContent = "Cerita anonim diposting 🌱";
setTimeout(()=>document.getElementById('appMsg').textContent="",2000);
};
function loadPrivat(uid){
const q = query(collection(db, "curhat_privat"), where("uid","==",uid), orderBy("createdAt","desc"));
onSnapshot(q, snap=>{
const list = document.getElementById('privatList');
list.innerHTML = "";
snap.forEach(doc=>{
const d = doc.data();
list.innerHTML += `<div class="story">${escapeHtml(d.text)}<small>Privat • barusan</small></div>`;
});
});
}
function loadPublik(){
const q = query(collection(db, "cerita_publik"), orderBy("createdAt","desc"));
onSnapshot(q, snap=>{
const list = document.getElementById('publikList');
list.innerHTML = "";
snap.forEach(doc=>{
const d = doc.data();
list.innerHTML += `<div class="story">${escapeHtml(d.text)}<small>Anonim • publik</small></div>`;
});
});
}
function escapeHtml(t){ const div=document.createElement('div'); div.textContent=t; return div.innerHTML; }
</script>
</body>
</html>
