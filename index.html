<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruang Lega V8 - Mohamad Yasser Arafath</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Plus Jakarta Sans',sans-serif;box-sizing:border-box}
body{margin:0;background:#EAF6EC;color:#1a3a1f}
.header{background:#2e7d32;color:white;padding:24px 20px 30px;border-radius:0 0 28px 28px;text-align:center}
.header h1{margin:0;font-size:22px}
.header p{margin:8px 0 0;opacity:.9;font-size:14px}
.container{max-width:480px;margin:-18px auto 0;padding:0 16px 100px}
.card{background:white;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(46,125,50,.12);margin-top:16px}
.btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:700;font-size:15px;cursor:pointer}
.btn-green{background:#2e7d32;color:white}
.btn-line{background:white;color:#2e7d32;border:2px solid #2e7d32;margin-top:10px}
textarea,input{width:100%;border:1.5px solid #c8e6c9;border-radius:14px;padding:14px;font-size:14px;outline:none}
textarea:focus{border-color:#2e7d32}
.mood{display:flex;gap:8px;margin:12px 0}
.mood button{flex:1;padding:12px;border-radius:12px;border:1.5px solid #c8e6c9;background:white;font-size:20px}
.mood button.active{background:#e8f5e9;border-color:#2e7d32}
.badge{display:inline-block;background:#e8f5e9;color:#2e7d32;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px}
.story{background:#f7fbf7;border-radius:14px;padding:14px;margin-top:12px;border-left:4px solid #2e7d32}
.small{font-size:12px;color:#78907b}
</style>
</head>
<body>
<div class="header">
<h1>Ruang Lega V8</h1>
<p>Halo, Mohamad Yasser Arafath 👋<br>Lega rasanya sudah pulang ke rumah</p>
</div>

<div class="container">

<div class="card" id="pageLogin">
<h3 style="margin:0">Masuk dulu, Mohamad</h3>
<p class="small">Gak perlu password, langsung cerita aja.</p>
<input id="namaInput" value="Mohamad Yasser Arafath" placeholder="Nama kamu">
<button class="btn btn-green" style="margin-top:12px" onclick="login()">Masuk ke Ruang Lega</button>
<button class="btn btn-line" onclick="login()">⚡ Lanjut Offline - Tetap Bisa Nulis</button>
<p class="small" style="text-align:center;margin-top:12px">Live di: mohamadyasserarafath-ctrl.github.io/Ruang-Lega/</p>
</div>

<div class="card" id="pageApp" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center">
<b id="sapa">Halo, Mohamad</b>
<span class="badge" id="legaScore">Skor Lega: 0</span>
</div>

<p class="small" style="margin-top:16px">Gimana perasaanmu hari ini?</p>
<div class="mood" id="moodList">
<button onclick="pickMood(this,'😭')">😭</button>
<button onclick="pickMood(this,'😔')">😔</button>
<button onclick="pickMood(this,'😐')">😐</button>
<button onclick="pickMood(this,'🙂')">🙂</button>
<button onclick="pickMood(this,'😊')">😊</button>
</div>

<textarea id="curhatInput" placeholder="Tulis curhat lega kamu di sini, Mohamad... Apa yang bikin berat hari ini?"></textarea>
<button class="btn btn-green" style="margin-top:12px" onclick="simpanCurhat()">💚 Simpan & Legakan</button>

<h4 style="margin:20px 0 0">Cerita kamu</h4>
<div id="listCerita"></div>
<button class="btn btn-line" onclick="hapusSemua()">Hapus Semua Cerita</button>
</div>

</div>

<script>
// === RUANG LEGA V8 - KODE LENGKAP MOHAMAD ===
let moodTerpilih = "";
let nama = localStorage.getItem('rl_nama') || "Mohamad Yasser Arafath";

function login(){
 const input = document.getElementById('namaInput').value.trim();
 if(input) nama = input;
 localStorage.setItem('rl_nama', nama);
 document.getElementById('pageLogin').style.display='none';
 document.getElementById('pageApp').style.display='block';
 document.getElementById('sapa').innerText = "Halo, "+nama.split(' ')[0];
 render();
}
if(localStorage.getItem('rl_nama')){
 document.getElementById('namaInput').value = localStorage.getItem('rl_nama');
}

function pickMood(el, mood){
 moodTerpilih = mood;
 document.querySelectorAll('.mood button').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
}

function simpanCurhat(){
 const teks = document.getElementById('curhatInput').value.trim();
 if(!teks) return alert('Tulis dulu curhatnya ya, Mohamad');
 const data = JSON.parse(localStorage.getItem('rl_v8_mohamad')||'[]');
 data.unshift({
  nama: nama,
  mood: moodTerpilih || '🙂',
  teks: teks,
  waktu: new Date().toLocaleString('id-ID')
 });
 localStorage.setItem('rl_v8_mohamad', JSON.stringify(data));
 document.getElementById('curhatInput').value = "";
 moodTerpilih = "";
 document.querySelectorAll('.mood button').forEach(b=>b.classList.remove('active'));
 render();
}

function render(){
 const data = JSON.parse(localStorage.getItem('rl_v8_mohamad')||'[]');
 document.getElementById('legaScore').innerText = "Skor Lega: "+data.length;
 document.getElementById('listCerita').innerHTML = data.length ? data.map(d=>`
  <div class="story">
   <div style="display:flex;justify-content:space-between"><b>${d.mood} ${d.nama.split(' ')[0]}</b><span class="small">${d.waktu}</span></div>
   <p style="margin:8px 0 0;font-size:14px;line-height:1.5">${d.teks}</p>
  </div>
 `).join('') : `<p class="small" style="text-align:center;margin-top:12px">Belum ada cerita. Tulis yang pertama biar lega.</p>`;
}

function hapusSemua(){
 if(confirm('Hapus semua cerita?')){localStorage.removeItem('rl_v8_mohamad');render();}
}

// Auto login kalau udah pernah masuk
if(localStorage.getItem('rl_nama')){
 login();
}
</script>
</body>
</html>
