<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V5 FITUR LENGKAP - Curhat Anonim</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f0e;--card:#121916;--card2:#1a2520;--border:#1f332b;--emerald:#10b981;--text:#e8f0eb;--muted:#7a9a8a;--faint:#3d5a4f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:300px 1fr 260px;gap:18px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:24px;padding:20px}
h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin-bottom:14px;font-weight:700}
input,textarea{width:100%;background:#0d1411;border:1px solid var(--border);border-radius:14px;color:var(--text);padding:12px 14px;font-family:inherit;font-size:14px;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avatar{font-size:22px;aspect-ratio:1;display:grid;place-items:center;background:#0d1411;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.2s}
.avatar.active{background:var(--emerald);border-color:var(--emerald);transform:scale(1.08)}
.font-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.font-btn{padding:10px;border-radius:12px;border:1px solid var(--border);background:#0d1411;color:var(--muted);cursor:pointer;font-size:12px}
.font-btn.active{background:var(--emerald);color:#000;border-color:var(--emerald);font-weight:700}
.style-row{display:flex;gap:8px;margin:10px 0}
.s-btn{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:#0d1411;color:var(--muted);cursor:pointer;font-size:13px}
.s-btn.active{background:var(--card2);color:var(--text);border-color:var(--emerald)}
.btn-primary{width:100%;padding:14px;border-radius:16px;border:0;background:var(--emerald);color:#000;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px}
.story{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(16,185,129,.15);color:var(--emerald);border:1px solid rgba(16,185,129,.2)}
.hashtag{display:inline-block;font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--border);margin:3px;color:var(--muted);cursor:pointer}
.emoji-picker{position:absolute;bottom:50px;left:0;right:0;background:#0d1411;border:1px solid var(--border);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;z-index:10;max-height:180px;overflow:auto}
.toggle{display:flex;align-items:center;gap:8px;background:#0d1411;border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.toggle.on{background:rgba(16,185,129,.2);border-color:var(--emerald);color:var(--emerald)}
</style>
</head>
